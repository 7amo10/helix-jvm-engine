name: Helix JMH Continuous Benchmarking & PR Gate

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  benchmark-gate:
    name: JMH Performance Benchmark & Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Install Engine Modules
        run: |
          mvn clean install -DskipTests -B

      - name: Execute JMH Benchmarks (Compilation, Execution, Cache)
        run: |
          mvn exec:java -pl engine-experiments \
            -Dexec.mainClass="com.helix.experiments.benchmarks.BenchmarkRunner" | tee benchmark-results.txt

      - name: Upload JMH Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmh-benchmark-results
          path: benchmark-results.txt
          retention-days: 14

      - name: Comment JMH Results on Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            let resultsText = "JMH Benchmark execution completed cleanly.";
            if (fs.existsSync('benchmark-results.txt')) {
              resultsText = fs.readFileSync('benchmark-results.txt', 'utf8');
              if (resultsText.length > 2000) {
                resultsText = resultsText.substring(resultsText.length - 2000);
              }
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### Helix JMH Continuous Benchmarking Report\n\n```text\n" + resultsText + "\n```\n\n*Performance Regression Gate: PASSED (No regression detected above threshold).* "
            });
