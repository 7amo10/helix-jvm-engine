name: Helix Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build, Unit & Integration Tests (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/uses-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Test Suite with JaCoCo Coverage
        run: |
          mvn clean verify -B

      - name: Generate Aggregate Javadoc Site
        run: |
          mvn javadoc:aggregate -DskipTests -B

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: helix-build-artifacts
          path: |
            **/target/*.jar
            **/target/site/jacoco/
            **/target/site/apidocs/
            **/target/*.jfr
          retention-days: 7
